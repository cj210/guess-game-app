[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-game-app"
version = "0.1.0"
description = "A simple number-guessing game built with Python and FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx2",
    "pyjwt",
    "pwdlib[argon2]",
    "python-dotenv",
	"python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
